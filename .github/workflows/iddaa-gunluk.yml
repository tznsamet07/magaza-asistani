# iddaa analiz aracının verisini her sabah günceller.
# Mağaza Asistanı uygulamasına dokunmaz; veri ayrı daldaki iddaa-veri/ klasörüne yazılır.
name: iddaa-gunluk
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/project-thread-brb60g
      - name: football-data.co.uk CSV indir
        run: |
          mkdir -p iddaa-veri
          for s in 2425 2526 2627; do
            for l in E0 E1 E2 E3 EC SC0 SC1 SC2 SC3 D1 D2 I1 I2 SP1 SP2 F1 F2 N1 B1 P1 T1 G1; do
              curl -sSfL -m 60 -A "Mozilla/5.0" -o "iddaa-veri/${l}_${s}.csv" "https://www.football-data.co.uk/mmz4281/${s}/${l}.csv" || echo "yok: $l $s"
            done
          done
          for l in ARG AUT BRA DNK FIN IRL JPN NOR POL ROU SWE SWZ USA; do
            curl -sSfL -m 60 -A "Mozilla/5.0" -o "iddaa-veri/${l}.csv" "https://www.football-data.co.uk/new/${l}.csv" || echo "yok: $l"
          done
          curl -sSfL -m 60 -A "Mozilla/5.0" -o iddaa-veri/fixtures.csv "https://www.football-data.co.uk/fixtures.csv" || echo "fikstür yok"
          python3 iddaa-veri/derle.py
      - name: Kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add iddaa-veri
          git commit -m "iddaa verisi güncellendi" || exit 0
          git push origin HEAD:claude/project-thread-brb60g
