# iddaa analiz aracının verisini günceller. Mağaza Asistanı uygulamasına dokunmaz;
# her şey claude/project-thread-brb60g dalındaki iddaa-veri/ klasörüne yazılır.
# - Her 30 dakikada: iddaa bülteni (oranlar, oran hareketi) + football-data fikstürü
# - Günde bir (05:xx UTC) ve elle çalıştırınca: geçmiş maç istatistikleri
name: iddaa-gunluk
on:
  schedule:
    - cron: "20,50 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: iddaa-veri
  cancel-in-progress: false
jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/project-thread-brb60g
          fetch-depth: 5
      - name: Bülten ve fikstür
        run: |
          cd iddaa-veri
          curl -sSfL -m 90 -A "Mozilla/5.0" -H "Referer: https://www.nesine.com/" -o nesine.json "https://cdnbulten.nesine.com/api/bulten/getprebultenfull" || echo "bülten alınamadı"
          curl -sSfL -m 60 -A "Mozilla/5.0" -o fixtures.csv "https://www.football-data.co.uk/fixtures.csv" || echo "fikstür alınamadı"
      - name: Geçmiş istatistikler (günde bir)
        run: |
          SAAT=$(date -u +%H); DAK=$(date -u +%M)
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ] && { [ "$SAAT" != "05" ] || [ "$DAK" -ge 40 ]; } && [ -f iddaa-veri/veri.json ]; then echo "bugün zaten güncel"; exit 0; fi
          for s in 2425 2526 2627; do
            for l in E0 E1 E2 E3 EC SC0 SC1 SC2 SC3 D1 D2 I1 I2 SP1 SP2 F1 F2 N1 B1 P1 T1 G1; do
              curl -sSfL -m 60 -A "Mozilla/5.0" -o "iddaa-veri/${l}_${s}.csv" "https://www.football-data.co.uk/mmz4281/${s}/${l}.csv" || echo "yok: $l $s"
            done
          done
          for l in ARG AUT BRA DNK FIN IRL JPN NOR POL ROU SWE SWZ USA; do
            curl -sSfL -m 60 -A "Mozilla/5.0" -o "iddaa-veri/${l}.csv" "https://www.football-data.co.uk/new/${l}.csv" || echo "yok: $l"
          done
          python3 iddaa-veri/derle.py
      - name: Bülteni derle
        run: |
          [ -f iddaa-veri/nesine.json ] && python3 iddaa-veri/bulten.py || echo "bülten yok, atlandı"
      - name: Kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add iddaa-veri
          git diff --cached --quiet && exit 0
          # Sık güncellenen bülten tek bir kayıt üzerinde tutulur, depo şişmesin
          if [ "$(git log -1 --format=%s)" = "iddaa bülteni" ]; then
            git commit -q --amend -m "iddaa bülteni" && git push -f origin HEAD:claude/project-thread-brb60g
          else
            git commit -q -m "iddaa bülteni" && git push origin HEAD:claude/project-thread-brb60g
          fi
