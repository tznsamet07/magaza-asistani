# iddaa analiz aracının verisini günceller. Mağaza Asistanı uygulamasına dokunmaz;
# her şey claude/project-thread-brb60g dalındaki iddaa-veri/ klasörüne yazılır.
# GitHub zamanlanmış işleri 5 dakikada bir başlatmıyor (pratikte saatte bir civarı). Bu yüzden her çalışma
# ~50 dakika açık kalır ve iddaa-veri/tur.sh'yi 5 dakikada bir tekrarlar; biri bitince sıradaki başlar.
# tur.sh: iddaa bülteni ve canlı bülten, oynanma, Smarkets, Polymarket, The Odds API (anahtar varsa), football-data,
# ESPN canlı/sonuç, ilk 11, xG, bildirimler, günün kuponları, haftalık karne. Her turdan önce dal yeniden çekilir,
# yani betikte yapılan değişiklik bir sonraki turda devreye girer.
name: iddaa-gunluk
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: iddaa-veri
  cancel-in-progress: false
jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      DAL: claude/project-thread-brb60g
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/project-thread-brb60g
          fetch-depth: 5
      - name: Veri turları (5 dakikada bir, ~50 dakika)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          BAS=$(date +%s)
          while :; do
            git fetch -q origin "+refs/heads/$DAL:refs/remotes/origin/$DAL" && git reset -q --hard "origin/$DAL" || echo "dal çekilemedi"
            timeout 900 bash iddaa-veri/tur.sh || echo "tur hatayla bitti"
            # Elle çalıştırmada zorla yenileme sadece ilk turda
            export GITHUB_EVENT_NAME=schedule
            [ $(( $(date +%s) - BAS )) -gt 2880 ] && break
            sleep $(( 300 - $(date +%s) % 300 ))
          done
