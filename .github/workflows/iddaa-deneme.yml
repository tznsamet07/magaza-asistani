name: iddaa-deneme
on:
  push:
    branches: [claude/project-thread-brb60g]
    paths: [.github/workflows/iddaa-deneme.yml]
permissions:
  contents: write
jobs:
  dene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p iddaa-veri/deneme
          cd iddaa-veri/deneme
          curl -sS -m 60 -A "Mozilla/5.0" -H "Referer: https://www.nesine.com/" -o nesine.json -w "nesine %{http_code} %{size_download}\n" "https://cdnbulten.nesine.com/api/bulten/getprebultenfull" > durum.txt 2>&1 || true
          curl -sS -m 60 -A "Mozilla/5.0" -o fx.csv -w "fixtures %{http_code} %{size_download}\n" "https://www.football-data.co.uk/fixtures.csv" >> durum.txt 2>&1 || true
          curl -sSI -m 60 -A "Mozilla/5.0" "https://www.football-data.co.uk/fixtures.csv" | grep -i -E "last-modified|date" >> durum.txt || true
          gzip -9 nesine.json || true
          rm -f fx.csv
          cat durum.txt
          cd ../..
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add iddaa-veri/deneme && git commit -m "deneme" && git push || true
