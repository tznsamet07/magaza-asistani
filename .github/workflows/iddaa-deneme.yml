name: iddaa-deneme
on:
  push:
    branches: [claude/project-thread-brb60g]
    paths: [.github/workflows/iddaa-deneme.yml]
permissions:
  contents: write
jobs:
  dene:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: |
          rm -rf deneme && mkdir -p deneme && cd deneme
          cat > dene.py <<'PY'
          import urllib.request, re, json, gzip, io
          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36", "Referer": "https://www.nesine.com/", "Origin": "https://www.nesine.com", "Accept-Encoding": "gzip"}
          def al(u, veri=None, tip=None):
              h = dict(UA)
              if tip: h["Content-Type"] = tip
              try:
                  r = urllib.request.urlopen(urllib.request.Request(u, data=veri, headers=h), timeout=25)
                  b = r.read()
                  if r.headers.get("Content-Encoding") == "gzip": b = gzip.decompress(b)
                  return r.status, b
              except Exception as e:
                  return getattr(e, "code", str(e)), (e.read() if hasattr(e, "read") else b"")
          out = open("sonuc.txt", "w")
          for u in ["https://bulten.nesine.com/api/bulten/geteventplaypercentages?sportId=1", "https://bulten.nesine.com/api/bulten/geteventplaypercentages?sportId=2",
                    "https://bulten.nesine.com/api/bulten/getOutcomePlayPercentages?sportId=1", "https://bw.nesine.com/v1/BestWinnersBets?sportId=1",
                    "https://bulten.nesine.com/api/bulten/getBestWinnersBets?sportId=1"]:
              s, b = al(u)
              out.write(f"\n=== {u} -> {s} {len(b)}\n{b[:2500]!r}\n")
          PY
          sed -i 's/^          //' dene.py
          timeout 300 python3 dene.py || true
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add deneme && git commit -m "deneme" && (git pull --rebase origin claude/project-thread-brb60g; git push) || true
