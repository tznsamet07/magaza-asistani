name: iddaa-deneme
on:
  push:
    branches: [claude/project-thread-brb60g]
    paths: [.github/workflows/iddaa-deneme.yml]
permissions:
  contents: write
jobs:
  dene:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: |
          rm -rf deneme && mkdir -p deneme
          cd iddaa-veri
          NES="-sSfL --compressed -m 90 -A Mozilla/5.0 -H Referer:https://www.nesine.com/"
          curl $NES -o nesine.json "https://cdnbulten.nesine.com/api/bulten/getprebultenfull" || true
          G1=$(date -u +%Y%m%d); G2=$(date -u -d tomorrow +%Y%m%d)
          curl -sSfL -m 60 -o espn-futbol-1.json "https://site.api.espn.com/apis/site/v2/sports/soccer/all/scoreboard?limit=500&dates=$G1" || true
          curl -sSfL -m 60 -o espn-futbol-2.json "https://site.api.espn.com/apis/site/v2/sports/soccer/all/scoreboard?limit=500&dates=$G2" || true
          (time timeout 400 python3 smarkets.py) > ../deneme/sonuc.txt 2>&1 || true
          python3 bulten.py >> ../deneme/sonuc.txt 2>&1 || true
          cp smarkets.json bulten.json ../deneme/ || true
          cd ..
          git checkout -- iddaa-veri
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add deneme && git commit -m "deneme" && (git pull --rebase origin claude/project-thread-brb60g; git push) || true
