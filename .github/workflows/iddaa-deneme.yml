name: iddaa-deneme
on:
  push:
    branches: [claude/project-thread-brb60g]
    paths: [.github/workflows/iddaa-deneme.yml]
permissions:
  contents: write
jobs:
  dene:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: |
          rm -rf deneme && mkdir -p deneme && cd deneme
          cat > dene.py <<'PY'
          import urllib.request, json, gzip
          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36", "Referer": "https://www.nesine.com/", "Origin": "https://www.nesine.com", "Accept-Encoding": "gzip"}
          def al(u):
              try:
                  r = urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=25)
                  b = r.read()
                  if r.headers.get("Content-Encoding") == "gzip": b = gzip.decompress(b)
                  return r.status, dict(r.headers), b
              except Exception as e:
                  return getattr(e, "code", str(e)), {}, (e.read() if hasattr(e, "read") else b"")
          out = open("sonuc.txt", "w")
          B = "https://site.api.espn.com/apis/site/v2/sports/soccer/"
          for u in [B + "all/summary?event=401879254", B + "700/summary?event=401879254", B + "eng.1/summary?event=401879254",
                    B + "all/scoreboard?dates=20261026", B + "all/scoreboard?dates=20261026&limit=500", B + "all/scoreboard?limit=500",
                    "https://site.web.api.espn.com/apis/site/v2/sports/soccer/all/summary?event=401879254",
                    "https://site.api.espn.com/apis/site/v2/sports/soccer/tur.1/summary?event=401879254"]:
              s, h, b = al(u)
              n = ""
              try:
                  j = json.loads(b); n = len(j.get("events", [])) if "events" in j else ("rosters" in j, j.get("header", {}).get("league", {}).get("slug"))
              except Exception as x: n = str(x)[:80]
              out.write(f"{u} -> {s} {len(b)} {n}\n")
          PY
          sed -i 's/^          //' dene.py
          timeout 300 python3 dene.py || true
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add deneme && git commit -m "deneme" && (git pull --rebase origin claude/project-thread-brb60g; git push) || true
